<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тесты Авито</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f5f5f5;color:#222}
h1{font-size:1.4em}
h2{font-size:1.15em;margin:0 0 14px}
h3{font-size:1.02em;margin:20px 0 10px}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.option{display:block;padding:14px 18px;border:2px solid #ddd;border-radius:10px;margin-bottom:10px;cursor:pointer;user-select:none;transition:all .15s;background:#fff;font-size:1em;position:relative;padding-left:52px}
.option::before{content:attr(data-letter);position:absolute;left:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em;color:#64748b;transition:all .15s}
.option:hover{border-color:#94a3b8;background:#f8fafc}
.option.selected{border-color:#00AAFF;background:#eff9ff}
.option.selected::before{background:#00AAFF;color:#fff}
.option.correct{border-color:#16a34a;background:#f0fdf4}
.option.correct::before{background:#16a34a;color:#fff;content:'✓'}
.option.wrong{border-color:#dc2626;background:#fef2f2}
.option.wrong::before{background:#dc2626;color:#fff;content:'✕'}
.option.disabled{cursor:not-allowed}
button{padding:10px 20px;font-size:1em;border:none;border-radius:8px;background:#00AAFF;color:#fff;cursor:pointer;font-weight:600}
button:hover{background:#0090db}
button:disabled{background:#94a3b8;cursor:not-allowed}
button.secondary{background:#64748b}
button.secondary:hover{background:#475569}
button.danger{background:#dc2626}
button.danger:hover{background:#b91c1c}
button.small{padding:6px 12px;font-size:.85em}
.hidden{display:none!important}
.toolbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.question-text{font-size:1.15em;font-weight:600;margin-bottom:14px}
.q-image{max-width:100%;max-height:300px;border-radius:8px;margin-bottom:14px;display:block;border:1px solid #e2e8f0}
.progress{font-size:.9em;color:#666;margin-bottom:10px}
.result{font-size:1.05em;padding:10px;border-radius:8px;margin-top:12px}
.result.ok{background:#f0fdf4;color:#166534}
.result.fail{background:#fef2f2;color:#991b1b}
.stats{display:flex;gap:20px;flex-wrap:wrap;font-size:.95em}
.stat b{font-size:1.4em;display:block}
.empty-state{text-align:center;padding:40px 20px;color:#94a3b8}
.test-card{border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.test-card:hover{border-color:#00AAFF}
.tc-info{flex:1;min-width:200px}
.tc-title{font-weight:700;font-size:1.05em;margin-bottom:4px}
.tc-meta{color:#64748b;font-size:.85em}
.tc-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #e2e8f0;flex-wrap:wrap}
.tab{padding:10px 18px;cursor:pointer;border:none;background:none;color:#64748b;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;border-radius:0}
.tab.active{color:#00AAFF;border-bottom-color:#00AAFF}
.userbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:10px;padding:12px 18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);flex-wrap:wrap;gap:10px}
.role-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75em;font-weight:700;text-transform:uppercase;margin-left:8px}
.role-admin{background:#fef3c7;color:#92400e}
.role-user{background:#dbeafe;color:#1e40af}
.role-guest{background:#dcfce7;color:#166534}
.auth-container{max-width:420px;margin:40px auto}
.auth-container h1{text-align:center;margin-bottom:24px}
.auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:#f1f5f9;padding:4px;border-radius:10px}
.auth-tab{flex:1;padding:10px;background:none;color:#64748b;border-radius:8px;font-weight:600}
.auth-tab.active{background:#fff;color:#00AAFF}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:.85em;color:#475569;margin-bottom:6px;font-weight:600}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:.95em;font-family:inherit}
.auth-container button[type=submit]{width:100%;padding:12px}
.auth-hint{font-size:.85em;color:#64748b;text-align:center;margin-top:16px;line-height:1.5}
#authMsg,#editorMsg{padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:.92em;display:none}
#authMsg.show,#editorMsg.show{display:block}
#authMsg.ok,#editorMsg.ok{background:#f0fdf4;color:#166534}
#authMsg.err,#editorMsg.err{background:#fef2f2;color:#991b1b}
.history-item{border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;overflow:hidden}
.history-head{padding:12px 14px;background:#fafafa;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.history-head:hover{background:#f1f5f9}
.history-head .h-title{font-weight:600;font-size:.95em}
.history-head .h-meta{color:#64748b;font-size:.85em;margin-top:4px}
.history-head .chev{color:#94a3b8;transition:.2s}
.history-item.open .chev{transform:rotate(90deg)}
.history-detail{padding:14px;border-top:1px solid #e2e8f0;font-size:.9em}
.q-review{margin-bottom:14px;padding:12px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0}
.q-review-title{font-weight:600;margin-bottom:8px;font-size:.95em}
.q-review-opts{display:flex;flex-direction:column;gap:5px}
.q-review-opt{padding:7px 11px;border-radius:6px;font-size:.88em;background:#fff;border:1px solid #e2e8f0}
.q-review-opt.correct{background:#f0fdf4;border-color:#16a34a}
.q-review-opt.chosen{background:#dbeafe;border-color:#2563eb;font-weight:600}
.q-review-opt.chosen.wrong{background:#fee2e2;border-color:#dc2626}
.attempt-log{margin-top:8px;padding:8px 12px;background:#fff;border-radius:6px;border:1px dashed #cbd5e1;font-size:.85em}
.attempt-log-row{padding:3px 0;border-bottom:1px solid #f1f5f9}
.attempt-log-row:last-child{border-bottom:none}
.q-review-meta{font-size:.82em;color:#64748b;margin-top:8px}
.explanation{margin-top:10px;padding:12px 14px;background:#eff9ff;border-left:4px solid #00AAFF;border-radius:6px;font-size:.92em;color:#1e293b;line-height:1.5}
.explanation-title{font-weight:700;color:#0090db;margin-bottom:4px;font-size:.85em;text-transform:uppercase;letter-spacing:.03em}
.result-summary{background:#f8fafc;border-radius:10px;padding:16px;margin-bottom:16px;border:1px solid #e2e8f0}
.editor-item{border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:12px;background:#fafafa}
.editor-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.editor-item-header .num{font-weight:700;color:#64748b;font-size:.9em}
.field{margin-bottom:10px}
.field label{display:block;font-size:.82em;color:#64748b;margin-bottom:4px;font-weight:600;text-transform:uppercase}
.opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.opt-row input[type=radio]{flex-shrink:0;width:auto}
.opt-row input[type=text]{flex:1}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.summary-box{background:#f8fafc;border-radius:10px;padding:14px;text-align:center;border:1px solid #e2e8f0}
.summary-box .val{font-size:1.7em;font-weight:700;color:#0090db}
.summary-box .lbl{font-size:.8em;color:#64748b;margin-top:4px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:480px;width:100%}
.modal h3{margin-top:0}
.img-preview{max-width:100%;max-height:150px;border-radius:6px;margin-top:8px;border:1px solid #e2e8f0}
.img-buttons{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.guest-banner{background:#dcfce7;color:#166534;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:.92em}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:2000;font-size:1.1em;color:#0090db;font-weight:600}
#loading .spin{width:32px;height:32px;border:3px solid #cbd5e1;border-top-color:#00AAFF;border-radius:50%;animation:sp 1s linear infinite;margin-right:12px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><span id="loadingText">Загрузка...</span></div>

<div id="authScreen" class="auth-container hidden">
  <h1>🧪 Тесты Авито</h1>
  <div class="card">
    <div class="auth-tabs">
      <button class="auth-tab active" data-authtab="login" onclick="switchAuthTab('login')">Вход</button>
      <button class="auth-tab" data-authtab="register" onclick="switchAuthTab('register')">Регистрация</button>
      <button class="auth-tab" data-authtab="guest" onclick="switchAuthTab('guest')">Гость</button>
    </div>
    <div id="authMsg"></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-row"><label>Логин</label><input type="text" id="loginUser" required></div>
      <div class="form-row"><label>Пароль</label><input type="password" id="loginPass" required></div>
      <button type="submit">Войти</button>
    </form>
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-row"><label>Логин</label><input type="text" id="regUser" required minlength="3"></div>
      <div class="form-row"><label>Пароль</label><input type="password" id="regPass" required minlength="4"></div>
      <div class="form-row"><label>Ещё раз</label><input type="password" id="regPass2" required></div>
      <button type="submit">Создать</button>
    </form>
    <form id="guestForm" class="hidden" onsubmit="handleGuest(event)">
      <div class="form-row"><label>Ваше ФИО</label><input type="text" id="guestFio" required placeholder="Иванов Иван Иванович"></div>
      <p style="font-size:.85em;color:#64748b;margin:0 0 14px">Без регистрации. Результаты сохранятся с вашим ФИО.</p>
      <button type="submit">Продолжить как гость</button>
    </form>
    <p class="auth-hint" id="authHint"></p>
  </div>
</div>

<div id="app" class="hidden">
  <div class="userbar">
    <div>Вы вошли как <b id="currentUser"></b><span id="currentRoleBadge" class="role-badge"></span></div>
    <div style="display:flex;gap:8px">
      <button id="changePassBtn" class="small secondary hidden" onclick="openChangePassModal()">🔑 Сменить пароль</button>
      <button class="small secondary" onclick="logout()">Выйти</button>
    </div>
  </div>
  <h1>🧪 Тесты Авито</h1>
  <div id="guestBanner" class="guest-banner hidden"></div>
  <div class="tabs">
    <button class="tab active" data-tab="tests" onclick="switchTab('tests')">📚 Тесты</button>
    <button class="tab admin-only hidden" data-tab="results" onclick="switchTab('results')">📊 Результаты</button>
    <button class="tab admin-only hidden" data-tab="users" onclick="switchTab('users')">👥 Пользователи</button>
  </div>

  <div id="tab-tests">
    <div id="testsListView">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
          <h2 style="margin:0">Доступные тесты</h2>
          <button class="admin-only hidden small" onclick="createTest()">+ Создать тест</button>
        </div>
        <div id="testsList"></div>
      </div>
    </div>
    <div id="startView" class="card hidden">
      <h2 id="startTitle"></h2>
      <p style="color:#64748b;font-size:.92em" id="startInfo"></p>
      <div class="toolbar">
        <button onclick="startTest()">▶ Начать</button>
        <button class="secondary" onclick="backToTests()">← К списку</button>
      </div>
    </div>
    <div id="testView" class="card hidden">
      <div class="progress" id="progress"></div>
      <div class="question-text" id="questionText"></div>
      <div id="questionImageWrap"></div>
      <div id="options"></div>
      <div id="resultBox"></div>
      <div class="toolbar">
        <button id="prevBtn" class="secondary hidden" onclick="prevQuestion()">← Назад</button>
        <button id="checkBtn" onclick="checkAnswer()">Проверить</button>
        <button id="nextBtn" class="secondary hidden" onclick="nextQuestion()">Следующий →</button>
      </div>
    </div>
    <div id="finishView" class="card hidden">
      <h2>📊 Результаты</h2>
      <div class="stats" id="finalStats"></div>
      <div id="finalReview" style="margin-top:20px"></div>
      <div class="toolbar">
        <button onclick="startTest()">Пройти заново</button>
        <button class="secondary" onclick="backToTests()">← К списку</button>
      </div>
    </div>
  </div>

  <div id="tab-results" class="hidden">
    <div class="card">
      <h2>Результаты по тестам</h2>
      <div class="form-row" style="max-width:400px"><label>Тест:</label>
        <select id="resultsTestFilter" onchange="renderResults()"></select>
      </div>
      <div class="form-row" style="max-width:400px"><label>Пользователь / гость:</label>
        <select id="resultsUserFilter" onchange="renderResults()"><option value="">Все</option></select>
      </div>
      <h3>Сводка</h3>
      <div class="summary-grid" id="globalSummary"></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <h2 style="margin:0">История</h2>
        <button class="small danger" onclick="clearTestHistory()">🗑 Очистить историю теста</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <div id="tab-users" class="hidden">
    <div class="card"><h2>Пользователи</h2><div id="usersList"></div></div>
  </div>

  <div id="tab-editor" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <div>
          <h2 style="margin:0" id="editorTitle">Редактор теста</h2>
          <p style="color:#64748b;font-size:.88em;margin:4px 0 0" id="editorInfo"></p>
        </div>
        <button class="secondary small" onclick="backToTests()">← К тестам</button>
      </div>
      <div class="form-row"><label>Название теста</label>
        <input type="text" id="editorTestName" oninput="updateTestName(this.value)">
      </div>
      <div id="editorMsg"></div>
      <div id="editorList"></div>
      <div class="toolbar"><button onclick="addQuestion()">+ Добавить вопрос</button></div>
    </div>
  </div>
</div>

<div id="changePassModal" class="modal-backdrop hidden" onclick="if(event.target===this)closeChangePassModal()">
  <div class="modal">
    <h3>Сменить пароль администратора</h3>
    <div class="form-row"><label>Текущий пароль</label><input type="password" id="chOldPass"></div>
    <div class="form-row"><label>Новый пароль</label><input type="password" id="chNewPass" placeholder="Минимум 4 символа"></div>
    <div class="form-row"><label>Новый пароль ещё раз</label><input type="password" id="chNewPass2"></div>
    <div id="chPassMsg" style="font-size:.9em;color:#dc2626;margin-bottom:10px"></div>
    <div class="toolbar" style="justify-content:flex-end">
      <button class="secondary" onclick="closeChangePassModal()">Отмена</button>
      <button onclick="submitChangePass()">Сохранить</button>
    </div>
  </div>
</div>

<div id="imageModal" class="modal-backdrop hidden" onclick="if(event.target===this)closeImageModal()">
  <div class="modal">
    <h3>Прикрепить картинку</h3>
    <div class="form-row"><label>URL картинки</label><input type="text" id="imgUrlInput" placeholder="https://..."></div>
    <div class="form-row"><label>или файл с диска</label><input type="file" id="imgFileInput" accept="image/*" onchange="loadImageFile(event)"></div>
    <div id="imgPreviewWrap"></div>
    <div class="toolbar" style="justify-content:flex-end">
      <button class="secondary" onclick="clearImage()">Убрать картинку</button>
      <button class="secondary" onclick="closeImageModal()">Отмена</button>
      <button onclick="saveImage()">Применить</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ============================================================
   FIREBASE
   ============================================================ */
var firebaseConfig = {
  apiKey: "AIzaSyCPWPw6-SeO9_4Nwt1ZmwxcGRI5dnucir4",
  authDomain: "avito-tests.firebaseapp.com",
  projectId: "avito-tests",
  storageBucket: "avito-tests.firebasestorage.app",
  messagingSenderId: "1007097355508",
  appId: "1:1007097355508:web:a98bf4d3d4069fc21392a1"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
var CACHE = { users: [], tests: [], history: [] };

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function hashPass(p){
  var h=5381;
  for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))|0;
  return 'h'+Math.abs(h).toString(36)+'_'+p.length
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  })
}
function showMsg(id,type,txt){
  var el=document.getElementById(id);if(!el)return;
  el.className='show '+type;el.textContent=txt;
  setTimeout(function(){el.className='';el.textContent=''},3500)
}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function hideLoading(){
  var l=document.getElementById('loading');if(l)l.classList.add('hidden')
}
function showLoading(txt){
  var l=document.getElementById('loading');
  var t=document.getElementById('loadingText');
  if(l)l.classList.remove('hidden');
  if(t)t.textContent=txt||'Загрузка...'
}
function letterOf(i){return String.fromCharCode(65+i)}

/* ============================================================
   ЗАГРУЗКА
   ============================================================ */
function loadAllData(){
  showLoading('Загрузка пользователей...');
  return db.collection('users').get().then(function(snap){
    CACHE.users = snap.docs.map(function(d){return Object.assign({_id:d.id}, d.data())});
    showLoading('Загрузка тестов...');
    return db.collection('tests').get()
  }).then(function(snap){
    CACHE.tests = snap.docs.map(function(d){return Object.assign({_id:d.id}, d.data())});
    showLoading('Загрузка истории...');
    return db.collection('history').get()
  }).then(function(snap){
    CACHE.history = snap.docs.map(function(d){return Object.assign({_id:d.id}, d.data())})
  })
}

function ensureAdminAndDemos(){
  var promises = [];
  if(CACHE.users.length === 0){
    var adminId = genId();
    var admin = {login:'admin', passHash:hashPass('admin'), role:'admin', createdAt:new Date().toISOString()};
    promises.push(db.collection('users').doc(adminId).set(admin).then(function(){
      CACHE.users.push(Object.assign({_id:adminId}, admin))
    }))
  }
  if(CACHE.tests.length === 0){
    var d1Id=genId(), d2Id=genId();
    var d1={name:'Демо: общие знания',questions:[
      {question:'Столица Франции?',options:['Лондон','Париж','Берлин','Мадрид'],correct:1,image:'',explanation:'Париж — столица Франции с 987 года.'},
      {question:'7 × 8 = ?',options:['54','56','48','64'],correct:1,image:'',explanation:'7 × 8 = 56. Табличное умножение.'}
    ]};
    var d2={name:'Демо: Авито',questions:[
      {question:'Что такое Авито?',options:['Соцсеть','Доска объявлений','Мессенджер','Банк'],correct:1,image:'',explanation:'Авито — крупнейшая в России доска объявлений.'},
      {question:'Основной цвет Авито?',options:['Красный','Синий','Зелёный','Жёлтый'],correct:1,image:'',explanation:'Фирменный цвет Авито — синий.'}
    ]};
    promises.push(db.collection('tests').doc(d1Id).set(d1).then(function(){
      CACHE.tests.push(Object.assign({_id:d1Id}, d1))
    }));
    promises.push(db.collection('tests').doc(d2Id).set(d2).then(function(){
      CACHE.tests.push(Object.assign({_id:d2Id}, d2))
    }))
  }
  return Promise.all(promises)
}

function getUsers(){return CACHE.users.slice()}
function getTests(){return CACHE.tests.slice()}
function getHistory(){return CACHE.history.slice()}

/* ============================================================
   СЕССИЯ
   ============================================================ */
var SESSION_KEY = 't_session_v2';
function getSession(){
  try{return JSON.parse(localStorage.getItem(SESSION_KEY))}catch(e){return null}
}
function setSession(s){
  s?localStorage.setItem(SESSION_KEY,JSON.stringify(s)):localStorage.removeItem(SESSION_KEY)
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function initApp(){
  loadAllData().then(function(){
    return ensureAdminAndDemos()
  }).then(function(){
    hideLoading();
    var s = getSession();
    if(s){
      if(s.type==='guest'){
        enterApp({login:s.fio,role:'guest',fio:s.fio,isGuest:true});return
      }
      var u = CACHE.users.find(function(x){return x.login===s.login});
      if(u){enterApp(u);return}
      setSession(null)
    }
    showAuthScreen()
  }).catch(function(e){
    hideLoading();
    document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#dc2626;font-family:system-ui">'+
      '<h2>Ошибка подключения к Firebase</h2>'+
      '<p style="background:#fef2f2;padding:14px;border-radius:8px;display:inline-block;text-align:left;max-width:600px">'+esc(e.message||e)+'</p>'+
      '<p style="color:#64748b;font-size:.9em;margin-top:20px">Проверьте: Firestore создан, правила опубликованы.</p></div>';
  })
}

function showAuthScreen(){
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  var hint=document.getElementById('authHint');
  if(CACHE.users.length===1 && CACHE.users[0].login==='admin'){
    hint.innerHTML='👋 Войдите как <b>admin / admin</b> или пройдите тест как гость'
  } else {
    hint.textContent='Войдите, создайте аккаунт или пройдите тест как гость'
  }
}

function switchAuthTab(name){
  document.querySelectorAll('.auth-tab').forEach(function(t){
    t.classList.toggle('active',t.dataset.authtab===name)
  });
  document.getElementById('loginForm').classList.toggle('hidden',name!=='login');
  document.getElementById('registerForm').classList.toggle('hidden',name!=='register');
  document.getElementById('guestForm').classList.toggle('hidden',name!=='guest');
  var m=document.getElementById('authMsg');m.className='';m.textContent=''
}

function handleLogin(e){
  e.preventDefault();
  var login=document.getElementById('loginUser').value.trim();
  var pass=document.getElementById('loginPass').value;
  var u=CACHE.users.find(function(x){return x.login.toLowerCase()===login.toLowerCase()});
  if(!u){showMsg('authMsg','err','Пользователь не найден');return}
  if(u.passHash!==hashPass(pass)){showMsg('authMsg','err','Неверный пароль');return}
  setSession({type:'user',login:u.login});
  document.getElementById('loginPass').value='';
  enterApp(u)
}

function handleRegister(e){
  e.preventDefault();
  var login=document.getElementById('regUser').value.trim();
  var pass=document.getElementById('regPass').value;
  var pass2=document.getElementById('regPass2').value;
  if(login.length<3){showMsg('authMsg','err','Логин минимум 3 символа');return}
  if(pass.length<4){showMsg('authMsg','err','Пароль минимум 4 символа');return}
  if(pass!==pass2){showMsg('authMsg','err','Пароли не совпадают');return}
  if(CACHE.users.some(function(x){return x.login.toLowerCase()===login.toLowerCase()})){
    showMsg('authMsg','err','Логин уже занят');return
  }
  var id=genId();
  var nu={login:login,passHash:hashPass(pass),role:'user',createdAt:new Date().toISOString()};
  db.collection('users').doc(id).set(nu).then(function(){
    CACHE.users.push(Object.assign({_id:id}, nu));
    setSession({type:'user',login:nu.login});
    document.getElementById('regUser').value='';
    document.getElementById('regPass').value='';
    document.getElementById('regPass2').value='';
    enterApp(Object.assign({_id:id}, nu))
  }).catch(function(err){showMsg('authMsg','err','Ошибка: '+err.message)})
}

function handleGuest(e){
  e.preventDefault();
  var fio=document.getElementById('guestFio').value.trim();
  if(fio.length<3){showMsg('authMsg','err','ФИО минимум 3 символа');return}
  setSession({type:'guest',fio:fio});
  document.getElementById('guestFio').value='';
  enterApp({login:fio,role:'guest',fio:fio,isGuest:true})
}

function logout(){setSession(null);currentUser=null;showAuthScreen()}

/* ============================================================
   ПРОХОЖДЕНИЕ
   ============================================================ */
var cur=0;
var chk=false;
var qStats=[];
var currentSel=[];
var started=0;

function startTest(){
  if(!currentTest)return;
  cur=0;
  qStats=currentTest.questions.map(function(){
    return {attempts:0, solved:false, choices:[], firstChoice:null}
  });
  currentSel=currentTest.questions.map(function(){return null});
  started=Date.now();
  document.getElementById('startView').classList.add('hidden');
  document.getElementById('finishView').classList.add('hidden');
  document.getElementById('testView').classList.remove('hidden');
  renderQ()
}

function renderQ(){
  chk=false;
  var q=currentTest.questions[cur];
  var sel=currentSel[cur];

  document.getElementById('progress').textContent =
    'Вопрос '+(cur+1)+' из '+currentTest.questions.length+' • Попыток: '+qStats[cur].attempts+
    (qStats[cur].solved?' • ✅ решён':'');

  document.getElementById('questionText').textContent=q.question||'(без текста)';

  var iw=document.getElementById('questionImageWrap');
  if(q.image&&q.image.trim()){
    iw.innerHTML='<img class="q-image" src="'+esc(q.image)+'" onerror="this.style.display=\'none\'">'
  } else {
    iw.innerHTML=''
  }

  var rb=document.getElementById('resultBox');
  rb.innerHTML='';rb.className='';

  var solvedQ = qStats[cur].solved;
  var opts=document.getElementById('options');
  opts.innerHTML='';
  q.options.forEach(function(text,i){
    var div=document.createElement('div');
    div.className='option';
    div.dataset.i=i;
    div.dataset.letter=letterOf(i);
    div.innerHTML='<span>'+esc(text||('Вариант '+(i+1)))+'</span>';

    if(solvedQ){
      div.classList.add('disabled');
      if(i===q.correct)div.classList.add('correct');
      else if(i===sel)div.classList.add('wrong');
    } else {
      if(i===sel)div.classList.add('selected');
      div.onclick=(function(idx){
        return function(){pickOption(idx)}
      })(i);
    }
    opts.appendChild(div)
  });

  var prevBtn=document.getElementById('prevBtn');
  prevBtn.classList.toggle('hidden',cur===0);

  var cb=document.getElementById('checkBtn');
  var nb=document.getElementById('nextBtn');

  if(solvedQ){
    cb.classList.add('hidden');
    nb.classList.remove('hidden');
    nb.textContent=(cur===currentTest.questions.length-1)?'Показать результаты →':'Следующий вопрос →'
  } else {
    cb.classList.remove('hidden');
    cb.disabled=false;
    nb.classList.add('hidden')
  }
}

function pickOption(i){
  if(chk)return;
  if(qStats[cur].solved)return;
  currentSel[cur]=i;
  document.querySelectorAll('.option').forEach(function(el){
    el.classList.toggle('selected', parseInt(el.dataset.i,10)===i)
  })
}

function checkAnswer(){
  if(currentSel[cur]===null){
    var r=document.getElementById('resultBox');
    r.innerHTML='⚠️ Выберите вариант';r.className='result fail';return
  }
  chk=true;
  var chosen=currentSel[cur];
  qStats[cur].attempts++;
  qStats[cur].choices.push(chosen);
  if(qStats[cur].firstChoice===null)qStats[cur].firstChoice=chosen;

  var q=currentTest.questions[cur];
  var ok=chosen===q.correct;

  if(ok){
    document.querySelectorAll('.option').forEach(function(el,i){
      el.classList.remove('selected','wrong');
      if(i===q.correct)el.classList.add('correct');
    });
    qStats[cur].solved=true;
    var rb=document.getElementById('resultBox');
    rb.className='result ok';
    rb.textContent='✅ Верно! Попыток на вопрос: '+qStats[cur].attempts;
    document.getElementById('checkBtn').classList.add('hidden');
    var nb=document.getElementById('nextBtn');
    nb.classList.remove('hidden');
    nb.textContent=(cur===currentTest.questions.length-1)?'Показать результаты →':'Следующий вопрос →'
  } else {
    document.querySelectorAll('.option').forEach(function(el,i){
      el.classList.remove('selected','correct');
      if(i===chosen)el.classList.add('wrong');
    });
    var rb2=document.getElementById('resultBox');
    rb2.className='result fail';
    rb2.textContent='❌ Неверно (попытка '+qStats[cur].attempts+'). Попробуйте другой вариант.';
    setTimeout(function(){
      chk=false;
      document.querySelectorAll('.option').forEach(function(el,i){
        el.classList.remove('correct','wrong');
        if(i===currentSel[cur])el.classList.add('selected');
        el.onclick=(function(idx){
          return function(){pickOption(idx)}
        })(i);
      });
      document.getElementById('checkBtn').disabled=false
    },1200)
  }
  document.getElementById('progress').textContent =
    'Вопрос '+(cur+1)+' из '+currentTest.questions.length+' • Попыток: '+qStats[cur].attempts+
    (qStats[cur].solved?' • ✅ решён':'')
}

function nextQuestion(){
  if(cur<currentTest.questions.length-1){cur++;renderQ()}
  else finishTest()
}
function prevQuestion(){
  if(cur>0){cur--;renderQ()}
}

function finishTest(){
  document.getElementById('testView').classList.add('hidden');
  document.getElementById('finishView').classList.remove('hidden');
  var tot=qStats.reduce(function(s,q){return s+q.attempts},0);
  var ft=qStats.filter(function(q){return q.solved&&q.attempts===1}).length;
  var solved=qStats.filter(function(q){return q.solved}).length;
  var el=Math.round((Date.now()-started)/1000);

  document.getElementById('finalStats').innerHTML =
    '<div class="stat"><b>'+currentTest.questions.length+'</b>вопросов</div>'+
    '<div class="stat"><b>'+solved+'</b>решено</div>'+
    '<div class="stat"><b>'+ft+'</b>с 1-й попытки</div>'+
    '<div class="stat"><b>'+tot+'</b>попыток</div>'+
    '<div class="stat"><b>'+el+'</b>сек</div>';

  // Разбор с правильными ответами и пояснениями
  var reviewHtml = currentTest.questions.map(function(q,i){
    var st = qStats[i];
    var optsHtml = q.options.map(function(opt, oi){
      var cls='q-review-opt';
      if(oi===q.correct)cls+=' correct';
      if(st.choices.indexOf(oi)!==-1 && oi!==q.correct)cls+=' chosen wrong';
      else if(st.choices.indexOf(oi)!==-1)cls+=' chosen';
      var marks=[];
      if(oi===q.correct)marks.push('✓ правильный');
      if(st.choices.indexOf(oi)!==-1)marks.push('👈 вы выбирали');
      return '<div class="'+cls+'">'+letterOf(oi)+') '+esc(opt)+' '+marks.join(' ')+'</div>'
    }).join('');

    var imgHtml = q.image && q.image.trim()
      ? '<img class="q-image" src="'+esc(q.image)+'" style="max-height:200px;margin-bottom:8px" onerror="this.style.display=\'none\'">'
      : '';

    var explHtml = q.explanation && q.explanation.trim()
      ? '<div class="explanation">'+
          '<div class="explanation-title">💡 Пояснение</div>'+
          esc(q.explanation)+
        '</div>'
      : '';

    return '<div class="q-review">'+
      '<div class="q-review-title">'+(i+1)+'. '+esc(q.question||'(без текста)')+
        (st.solved?' <span style="color:#16a34a">✅</span>':' <span style="color:#dc2626">❌</span>')+
      '</div>'+
      imgHtml+
      '<div class="q-review-opts">'+optsHtml+'</div>'+
      explHtml+
      '<div class="q-review-meta">'+
        'Попыток: '+st.attempts+
        (st.firstChoice!==null?' • Первый выбор: '+letterOf(st.firstChoice):'')+
      '</div>'+
    '</div>'
  }).join('');

  document.getElementById('finalReview').innerHTML = '<h3>📝 Разбор ответов</h3>' + reviewHtml;

  // Сохранение в историю
  var details = currentTest.questions.map(function(q,i){
    var choices = qStats[i].choices.slice();
    var attemptLog = choices.map(function(chosenIdx, idx){
      return {
        attempt: idx + 1,
        chosen: chosenIdx,
        isCorrect: chosenIdx === q.correct
      }
    });
    return {
      question: q.question,
      options: q.options,
      correct: q.correct,
      explanation: q.explanation || '',
      image: q.image || '',
      attempts: qStats[i].attempts,
      solved: qStats[i].solved,
      choices: choices,
      firstChoice: qStats[i].firstChoice,
      attemptLog: attemptLog
    }
  });

  var rec = {
    testId: currentTest._id,
    testName: currentTest.name,
    user: currentUser.login,
    userRole: currentUser.role,
    fio: currentUser.role==='guest'?currentUser.fio:null,
    date: new Date().toLocaleString('ru-RU'),
    timestamp: Date.now(),
    questions: currentTest.questions.length,
    totalAttempts: tot,
    solvedFirstTry: ft,
    elapsed: el,
    details: details
  };

  var id = genId();
  db.collection('history').doc(id).set(rec).then(function(){
    CACHE.history.unshift(Object.assign({_id:id}, rec))
  }).catch(function(e){
    console.error('Не удалось сохранить результат:', e);
    alert('Результат не сохранён: '+e.message)
  })
}

}
function closeChangePassModal(){
  document.getElementById('changePassModal').classList.add('hidden')
}
function submitChangePass(){
  var oldP=document.getElementById('chOldPass').value;
  var newP=document.getElementById('chNewPass').value;
  var newP2=document.getElementById('chNewPass2').value;
  var msg=document.getElementById('chPassMsg');
  msg.textContent='';
  if(currentUser.role!=='admin'){msg.textContent='Только для администратора';return}
  var u=CACHE.users.find(function(x){return x.login===currentUser.login});
  if(!u){msg.textContent='Пользователь не найден';return}
  if(u.passHash!==hashPass(oldP)){msg.textContent='Текущий пароль неверный';return}
  if(newP.length<4){msg.textContent='Новый пароль — минимум 4 символа';return}
  if(newP!==newP2){msg.textContent='Новые пароли не совпадают';return}
  db.collection('users').doc(u._id).update({passHash:hashPass(newP)}).then(function(){
    u.passHash=hashPass(newP);
    closeChangePassModal();
    alert('Пароль администратора изменён')
  }).catch(function(e){msg.textContent='Ошибка: '+e.message})
}

function renderResults(){
  var tests=getTests();
  var h=getHistory();
  var sel1=document.getElementById('resultsTestFilter');
  var cur1=sel1.value;
  sel1.innerHTML='<option value="">— выберите тест —</option>'+
    tests.map(function(t){
      return '<option value="'+t._id+'"'+(t._id===cur1?' selected':'')+'>'+esc(t.name)+'</option>'
    }).join('');
  if(!cur1&&tests.length){cur1=tests[0]._id;sel1.value=cur1}

  var sel2=document.getElementById('resultsUserFilter');
  var cur2=sel2.value;
  var users=[];
  h.forEach(function(r){if(r.user&&users.indexOf(r.user)===-1)users.push(r.user)});
  sel2.innerHTML='<option value="">Все</option>'+
    users.map(function(u){
      return '<option value="'+esc(u)+'"'+(u===cur2?' selected':'')+'>'+esc(u)+'</option>'
    }).join('');

  var filtered=h.filter(function(r){
    if(cur1&&r.testId!==cur1)return false;

  });

  if(!filtered.length){
    sum.innerHTML='<div class="empty-state" style="grid-column:1/-1">Нет прохождений по этому фильтру</div>'
  } else {
    var totRuns=filtered.length;
    var totQ=filtered.reduce(function(s,r){return s+r.questions},0);
    var totA=filtered.reduce(function(s,r){return s+r.totalAttempts},0);
    var totF=filtered.reduce(function(s,r){return s+r.solvedFirstTry},0);
    sum.innerHTML=
      '<div class="summary-box"><div class="val">'+totRuns+'</div><div class="lbl">прохождений</div></div>'+
      '<div class="summary-box"><div class="val">'+totQ+'</div><div class="lbl">вопросов</div></div>'+
      '<div class="summary-box"><div class="val">'+totA+'</div><div class="lbl">попыток</div></div>'+
      '<div class="summary-box"><div class="val">'+totF+'</div><div class="lbl">с 1-й</div></div>'
  }

  var list=document.getElementById('historyList');
  if(!filtered.length){
    list.innerHTML='<div class="empty-state">Пусто</div>';return
  }
  list.innerHTML=filtered.map(function(r,idx){
    var who=r.userRole==='guest'?'👤 '+esc(r.fio)+' (гость)':'👤 '+esc(r.user);
    return '<div class="history-item" data-idx="'+idx+'">'+
      '<div class="history-head" onclick="toggleHistoryDetail('+idx+')">'+
        '<div>'+
          '<div class="h-title">'+esc(r.date)+' — <span style="color:#0090db">'+esc(r.testName)+'</span></div>'+
          '<div class="h-meta">'+who+' • '+r.questions+' вопр. • '+r.totalAttempts+' попыток • '+r.solvedFirstTry+' с 1-й • '+r.elapsed+' сек</div>'+
        '</div>'+
        '<span class="chev">▸</span>'+
      '</div>'+
      '<div class="history-detail hidden">'+buildHistoryDetailHTML(r)+'</div>'+
    '</div>'
  }).join('')
}

function toggleHistoryDetail(idx){
  var item=document.querySelector('.history-item[data-idx="'+idx+'"]');
  if(!item)return;
  item.classList.toggle('open');
  var d=item.querySelector('.history-detail');
  d.classList.toggle('hidden')
}

function buildHistoryDetailHTML(r){
  var details=r.details;
  if(!details||!details.length){
    return '<p style="color:#94a3b8">Детали недоступны (запись старая)</p>'
  }
  return details.map(function(d,i){
    var optsHtml=d.options.map(function(opt,oi){
      var cls='q-review-opt';
      if(oi===d.correct)cls+=' correct';
      if(d.choices&&d.choices.indexOf(oi)!==-1 && oi!==d.correct)cls+=' wrong';
      if(d.choices&&d.choices.indexOf(oi)!==-1)cls+=' chosen';
      var marks=[];
      if(d.choices&&d.choices.indexOf(oi)!==-1)marks.push('👈 выбирал');
      if(oi===d.correct)marks.push('✓ правильный');
      return '<div class="'+cls+'">'+letterOf(oi)+') '+esc(opt)+' '+marks.join(' ')+'</div>'
    }).join('');

    var imgHtml = d.image && d.image.trim()
      ? '<img class="q-image" src="'+esc(d.image)+'" style="max-height:180px;margin-bottom:8px" onerror="this.style.display=\'none\'">'
      : '';

    var explHtml = d.explanation && d.explanation.trim()
      ? '<div class="explanation">'+
          '<div class="explanation-title">💡 Пояснение</div>'+
          esc(d.explanation)+
        '</div>'
      : '';

    var logHtml='';
    if(d.attemptLog&&d.attemptLog.length){
      logHtml='<div class="attempt-log">'+
        '<b>Все попытки:</b>'+
        d.attemptLog.map(function(a){
          return '<div class="attempt-log-row">'+
            'Попытка '+a.attempt+': <b>'+letterOf(a.chosen)+'</b> '+
            (a.isCorrect?'<span style="color:#16a34a">✓ верно</span>':'<span style="color:#dc2626">✕ неверно</span>')+
          '</div>'
        }).join('')+
      '</div>'
    }

    return '<div class="q-review">'+
      '<div class="q-review-title">'+(i+1)+'. '+esc(d.question||'(без текста)')+'</div>'+
      imgHtml+
      '<div class="q-review-opts">'+optsHtml+'</div>'+
      explHtml+
      logHtml+
      '<div class="q-review-meta">'+
        'Попыток: '+d.attempts+' • '+
        (d.solved?'✅ решён':'❌ не решён')+
        (d.firstChoice!==null&&d.firstChoice!==undefined?' • Первый выбор: '+letterOf(d.firstChoice):'')+
      '</div>'+
    '</div>'
  }).join('')
}

function clearTestHistory(){
  var sel1=document.getElementById('resultsTestFilter').value;
  if(!sel1){alert('Выберите тест');return}
  if(!confirm('Удалить историю по этому тесту?'))return;
  var toDelete=CACHE.history.filter(function(r){return r.testId===sel1});
  var batch=db.batch();
  toDelete.forEach(function(r){
    batch.delete(db.collection('history').doc(r._id))
  });
  batch.commit().then(function(){
    CACHE.history=CACHE.history.filter(function(r){return r.testId!==sel1});
    renderResults()
  }).catch(function(e){alert('Ошибка: '+e.message)})
}

/* ============================================================
   ПОЛЬЗОВАТЕЛИ (admin)
   ============================================================ */
function renderUsers(){
  var users=getUsers();var h=getHistory();
  var el=document.getElementById('usersList');
  el.innerHTML=
    '<div style="margin-bottom:12px;font-size:.9em;color:#64748b">'+
      'Всего: <b>'+users.length+'</b>. '+
      '<span class="role-badge role-admin">Админ</span> — доступ к редактору и результатам. '+
      '<span class="role-badge role-user">Пользователь</span> — проходит тесты.'+
    '</div>'+
    '<table style="width:100%;border-collapse:collapse"><thead>'+
      '<tr style="text-align:left;background:#f8fafc">'+
        '<th style="padding:10px;border-bottom:2px solid #e2e8f0">Логин</th>'+
        '<th style="padding:10px;border-bottom:2px solid #e2e8f0">Роль</th>'+
        '<th style="padding:10px;border-bottom:2px solid #e2e8f0">Прохождений</th>'+
        '<th style="padding:10px;border-bottom:2px solid #e2e8f0;text-align:right">Действия</th>'+
      '</tr></thead><tbody>'+
      users.map(function(u){
        var runs=h.filter(function(r){return r.user===u.login}).length;
        var isSelf=u.login===currentUser.login;
        var isRootAdmin=u.login==='admin';
        var canDel=!isSelf&&!isRootAdmin;
        return '<tr style="border-bottom:1px solid #eef2f7">'+
          '<td style="padding:10px"><b>'+esc(u.login)+'</b>'+
            (isSelf?' <span style="color:#00AAFF;font-size:.82em">(вы)</span>':'')+
            (isRootAdmin?' <span style="color:#92400e;font-size:.78em">🔒 основной</span>':'')+'</td>'+
          '<td style="padding:10px"><span class="role-badge '+(u.role==='admin'?'role-admin':'role-user')+'">'+
            (u.role==='admin'?'Админ':'Пользователь')+'</span></td>'+
          '<td style="padding:10px">'+runs+'</td>'+
          '<td style="padding:10px;text-align:right">'+
            (u.role!=='admin'?'<button class="small secondary" onclick="promoteUser(\''+esc(u.login)+'\')">↑ Сделать админом</button> ':'')+
            (u.role==='admin'&&!isRootAdmin&&!isSelf?'<button class="small secondary" onclick="demoteUser(\''+esc(u.login)+'\')">↓ Разжаловать</button> ':'')+
            (u.role!=='admin'?'<button class="small secondary" onclick="resetUserPassword(\''+esc(u.login)+'\')">🔑 Сброс пароля</button> ':'')+
            (canDel?'<button class="small danger" onclick="deleteUser(\''+esc(u.login)+'\')">🗑 Удалить</button>':'')+
          '</td>'+
        '</tr>'
      }).join('')+
    '</tbody></table>'
}

function promoteUser(login){
  if(!confirm('Сделать «'+login+'» администратором?'))return;
  var u=CACHE.users.find(function(x){return x.login===login});
  if(!u)return;
  db.collection('users').doc(u._id).update({role:'admin'}).then(function(){
    u.role='admin';renderUsers()
  }).catch(function(e){alert('Ошибка: '+e.message)})
}

function demoteUser(login){
  if(!confirm('Разжаловать «'+login+'» в обычного пользователя?'))return;
  var u=CACHE.users.find(function(x){return x.login===login});
  if(!u)return;
  db.collection('users').doc(u._id).update({role:'user'}).then(function(){
    u.role='user';renderUsers()
  }).catch(function(e){alert('Ошибка: '+e.message)})
}

function resetUserPassword(login){
  var np=prompt('Новый пароль для «'+login+'» (минимум 4 символа):','');
  if(np===null)return;
  if(np.length<4){alert('Слишком короткий');return}
  var u=CACHE.users.find(function(x){return x.login===login});
  if(!u)return;
  db.collection('users').doc(u._id).update({passHash:hashPass(np)}).then(function(){
    u.passHash=hashPass(np);
    alert('Пароль для «'+login+'» изменён на: '+np)
  }).catch(function(e){alert('Ошибка: '+e.message)})
}

function deleteUser(login){
  var u=CACHE.users.find(function(x){return x.login===login});
  if(!u)return;
  if(u.login===currentUser.login){alert('Нельзя удалить самого себя');return}
  if(u.login==='admin'){alert('Нельзя удалить главного администратора');return}

  var runs=CACHE.history.filter(function(r){return r.user===login}).length;
  var isAdmin=u.role==='admin';
  var msg='Удалить аккаунт «'+login+'»?';
  if(isAdmin)msg+='\n\n⚠️ Это АДМИНИСТРАТОР — он тоже потеряет доступ.';
  if(runs>0)msg+='\n\nВместе с аккаунтом будет удалено '+runs+' записей истории.';
  msg+='\n\nДействие нельзя отменить.';
  if(!confirm(msg))return;

  var toDel=CACHE.history.filter(function(r){return r.user===login});
  var batch=db.batch();
  batch.delete(db.collection('users').doc(u._id));
  toDel.forEach(function(r){
    batch.delete(db.collection('history').doc(r._id))
  });
  batch.commit().then(function(){
    CACHE.users=CACHE.users.filter(function(x){return x.login!==login});
    CACHE.history=CACHE.history.filter(function(r){return r.user!==login});
    renderUsers()
  }).catch(function(e){alert('Ошибка удаления: '+e.message)})
}

/* ============================================================
   РЕДАКТОР
   ============================================================ */
var editTestId=null;

function createTest(){
  var name=prompt('Название теста:','Новый тест');
  if(!name||!name.trim())return;
  var id=genId();
  var nt={name:name.trim(),questions:[]};
  db.collection('tests').doc(id).set(nt).then(function(){
    CACHE.tests.push(Object.assign({_id:id}, nt));
    editTestId=id;
    switchTab('editor')
  }).catch(function(e){alert('Ошибка: '+e.message)})
}

function editTest(id){editTestId=id;switchTab('editor')}

function deleteTest(id){
  var t=CACHE.tests.find(function(x){return x._id===id});
  if(!t)return;
  if(!confirm('Удалить тест «'+t.name+'»? Вся история по нему тоже удалится.'))return;
  var toDel=CACHE.history.filter(function(r){return r.testId===id});
  var batch=db.batch();
  batch.delete(db.collection('tests').doc(id));
  toDel.forEach(function(r){
    batch.delete(db.collection('history').doc(r._id))
  });
  batch.commit().then(function(){
    CACHE.tests=CACHE.tests.filter(function(x){return x._id!==id});
    CACHE.history=CACHE.history.filter(function(r){return r.testId!==id});
    renderTests()
  }).catch(function(e){alert('Ошибка: '+e.message)})
}

function renderEditor(){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t){switchTab('tests');return}
  document.getElementById('editorTitle').textContent='Редактор: '+t.name;
  document.getElementById('editorInfo').textContent='Вопросов: '+(t.questions||[]).length;
  document.getElementById('editorTestName').value=t.name;
  var list=document.getElementById('editorList');
  if(!t.questions.length){
    list.innerHTML='<div class="empty-state">Нет вопросов — добавьте первый</div>';return
  }
  list.innerHTML=t.questions.map(function(q,qi){
    var opts=q.options.map(function(opt,oi){
      return '<div class="opt-row">'+
        '<input type="radio" name="c_'+qi+'" '+(q.correct===oi?'checked':'')+' onchange="setCorrect('+qi+','+oi+')" title="Правильный">'+
        '<input type="text" value="'+esc(opt)+'" oninput="updOpt('+qi+','+oi+',this.value)" placeholder="Вариант '+letterOf(oi)+'">'+
        '<button class="small secondary" onclick="delOpt('+qi+','+oi+')" '+(q.options.length<=2?'disabled':'')+'>✕</button>'+
      '</div>'
    }).join('');
    var imgBlock=q.image&&q.image.trim()
      ?'<img class="img-preview" src="'+esc(q.image)+'" onerror="this.style.display=\'none\'">'
      :'<div style="font-size:.85em;color:#94a3b8;margin-top:4px">Картинка не прикреплена</div>';
    return '<div class="editor-item">'+
      '<div class="editor-item-header"><span class="num">Вопрос '+(qi+1)+'</span>'+
        '<button class="small danger" onclick="delQ('+qi+')">Удалить</button></div>'+
      '<div class="field"><label>Текст</label><input type="text" value="'+esc(q.question)+'" oninput="updQ('+qi+',this.value)"></div>'+
      '<div class="field"><label>Картинка</label>'+imgBlock+
        '<div class="img-buttons">'+
          '<button class="small secondary" onclick="openImageModal('+qi+')">🖼 '+(q.image?'Заменить':'Прикрепить')+'</button>'+
          (q.image?'<button class="small danger" onclick="removeQImage('+qi+')">Убрать</button>':'')+
        '</div></div>'+
      '<div class="field"><label>💡 Пояснение (видно после прохождения)</label>'+
        '<textarea oninput="updExplanation('+qi+',this.value)" placeholder="Почему этот ответ правильный? Что важно запомнить?" style="min-height:80px;font-size:.92em">'+esc(q.explanation||'')+'</textarea>'+
      '</div>'+
      '<div class="field"><label>Варианты (радио = правильный)</label>'+opts+
        '<button class="small secondary" onclick="addOpt('+qi+')" style="margin-top:6px">+ вариант</button></div>'+
    '</div>'
  }).join('')
}

function saveTestField(updates){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  db.collection('tests').doc(editTestId).update(updates).catch(function(e){
    showMsg('editorMsg','err','Ошибка: '+e.message)
  })
}

function updateTestName(v){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.name=v;
  document.getElementById('editorTitle').textContent='Редактор: '+v;
  saveTestField({name:v})
}

function addQuestion(){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions.push({question:'',options:['','','',''],correct:0,image:'',explanation:''});
  saveTestField({questions:t.questions});
  renderEditor()
}

function updQ(qi,v){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions[qi].question=v;
  saveTestField({questions:t.questions})
}

function updOpt(qi,oi,v){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions[qi].options[oi]=v;
  saveTestField({questions:t.questions})
}

function updExplanation(qi,v){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions[qi].explanation=v;
  saveTestField({questions:t.questions})
}

function setCorrect(qi,oi){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions[qi].correct=oi;
  saveTestField({questions:t.questions})
}

function addOpt(qi){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions[qi].options.push('');
  saveTestField({questions:t.questions});
  renderEditor()
}

function delOpt(qi,oi){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t||t.questions[qi].options.length<=2)return;
  t.questions[qi].options.splice(oi,1);
  if(t.questions[qi].correct===oi)t.questions[qi].correct=0;
  else if(t.questions[qi].correct>oi)t.questions[qi].correct--;
  saveTestField({questions:t.questions});
  renderEditor()
}

function delQ(qi){
  if(!confirm('Удалить вопрос?'))return;
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions.splice(qi,1);
  saveTestField({questions:t.questions});
  renderEditor()
}

/* ============================================================
   КАРТИНКИ
   ============================================================ */
var imgTargetQ=null;
var imgPendingData=null;

function openImageModal(qi){
  imgTargetQ=qi;
  imgPendingData=null;
  document.getElementById('imgUrlInput').value='';
  document.getElementById('imgFileInput').value='';
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  var curImg=t?t.questions[qi].image:'';
  document.getElementById('imgPreviewWrap').innerHTML=curImg?'<img class="img-preview" src="'+esc(curImg)+'">':'';
  document.getElementById('imageModal').classList.remove('hidden')
}
function closeImageModal(){
  document.getElementById('imageModal').classList.add('hidden');
  imgTargetQ=null;imgPendingData=null
}
function loadImageFile(e){
  var f=e.target.files[0];if(!f)return;
  if(f.size>800*1024){
    alert('Файл больше 800 КБ. Используйте URL или меньший файл.');
    e.target.value='';return
  }
  var r=new FileReader();
  r.onload=function(ev){
    imgPendingData=ev.target.result;
    document.getElementById('imgPreviewWrap').innerHTML='<img class="img-preview" src="'+imgPendingData+'">'
  };
  r.readAsDataURL(f)
}
function saveImage(){
  if(imgTargetQ===null)return;
  var url=document.getElementById('imgUrlInput').value.trim();
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  if(imgPendingData){t.questions[imgTargetQ].image=imgPendingData}
  else if(url){t.questions[imgTargetQ].image=url}
  saveTestField({questions:t.questions});
  closeImageModal();
  renderEditor()
}
function clearImage(){
  document.getElementById('imgUrlInput').value='';
  document.getElementById('imgFileInput').value='';
  imgPendingData=null;
  document.getElementById('imgPreviewWrap').innerHTML=''
}
function removeQImage(qi){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions[qi].image='';
  saveTestField({questions:t.questions});
  renderEditor()
}

initApp();
</script>
