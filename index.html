<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тесты Авито</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f5f5f5;color:#222}
h1{font-size:1.4em}
h2{font-size:1.15em;margin:0 0 14px}
h3{font-size:1.02em;margin:20px 0 10px}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.option{display:block;padding:12px 14px;border:2px solid #ddd;border-radius:8px;margin-bottom:10px;cursor:pointer;user-select:none}
.option:hover{border-color:#888}
.option.selected{border-color:#00AAFF;background:#eff9ff}
.option.correct{border-color:#16a34a;background:#f0fdf4}
.option.wrong{border-color:#dc2626;background:#fef2f2}
.option input{margin-right:10px}
button{padding:10px 20px;font-size:1em;border:none;border-radius:8px;background:#00AAFF;color:#fff;cursor:pointer;font-weight:600}
button:hover{background:#0090db}
button:disabled{background:#94a3b8;cursor:not-allowed}
button.secondary{background:#64748b}
button.secondary:hover{background:#475569}
button.danger{background:#dc2626}
button.danger:hover{background:#b91c1c}
button.small{padding:6px 12px;font-size:.85em}
.hidden{display:none!important}
.toolbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.question-text{font-size:1.15em;font-weight:600;margin-bottom:14px}
.q-image{max-width:100%;max-height:300px;border-radius:8px;margin-bottom:14px;display:block;border:1px solid #e2e8f0}
.progress{font-size:.9em;color:#666;margin-bottom:10px}
.result{font-size:1.05em;padding:10px;border-radius:8px;margin-top:12px}
.result.ok{background:#f0fdf4;color:#166534}
.result.fail{background:#fef2f2;color:#991b1b}
.stats{display:flex;gap:20px;flex-wrap:wrap;font-size:.95em}
.stat b{font-size:1.4em;display:block}
.empty-state{text-align:center;padding:40px 20px;color:#94a3b8}
.test-card{border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.test-card:hover{border-color:#00AAFF}
.tc-info{flex:1;min-width:200px}
.tc-title{font-weight:700;font-size:1.05em;margin-bottom:4px}
.tc-meta{color:#64748b;font-size:.85em}
.tc-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #e2e8f0;flex-wrap:wrap}
.tab{padding:10px 18px;cursor:pointer;border:none;background:none;color:#64748b;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;border-radius:0}
.tab.active{color:#00AAFF;border-bottom-color:#00AAFF}
.userbar{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:10px;padding:12px 18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);flex-wrap:wrap;gap:10px}
.role-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75em;font-weight:700;text-transform:uppercase;margin-left:8px}
.role-admin{background:#fef3c7;color:#92400e}
.role-user{background:#dbeafe;color:#1e40af}
.role-guest{background:#dcfce7;color:#166534}
.auth-container{max-width:420px;margin:40px auto}
.auth-container h1{text-align:center;margin-bottom:24px}
.auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:#f1f5f9;padding:4px;border-radius:10px}
.auth-tab{flex:1;padding:10px;background:none;color:#64748b;border-radius:8px;font-weight:600}
.auth-tab.active{background:#fff;color:#00AAFF}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:.85em;color:#475569;margin-bottom:6px;font-weight:600}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:.95em;font-family:inherit}
.auth-container button[type=submit]{width:100%;padding:12px}
.auth-hint{font-size:.85em;color:#64748b;text-align:center;margin-top:16px;line-height:1.5}
#authMsg,#editorMsg{padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:.92em;display:none}
#authMsg.show,#editorMsg.show{display:block}
#authMsg.ok,#editorMsg.ok{background:#f0fdf4;color:#166534}
#authMsg.err,#editorMsg.err{background:#fef2f2;color:#991b1b}
.history-item{border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;overflow:hidden}
.history-head{padding:12px 14px;background:#fafafa}
.history-head .h-title{font-weight:600;font-size:.95em}
.history-head .h-meta{color:#64748b;font-size:.85em;margin-top:4px}
.editor-item{border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:12px;background:#fafafa}
.editor-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.editor-item-header .num{font-weight:700;color:#64748b;font-size:.9em}
.field{margin-bottom:10px}
.field label{display:block;font-size:.82em;color:#64748b;margin-bottom:4px;font-weight:600;text-transform:uppercase}
.opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.opt-row input[type=radio]{flex-shrink:0;width:auto}
.opt-row input[type=text]{flex:1}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.summary-box{background:#f8fafc;border-radius:10px;padding:14px;text-align:center;border:1px solid #e2e8f0}
.summary-box .val{font-size:1.7em;font-weight:700;color:#0090db}
.summary-box .lbl{font-size:.8em;color:#64748b;margin-top:4px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:480px;width:100%}
.modal h3{margin-top:0}
.img-preview{max-width:100%;max-height:150px;border-radius:6px;margin-top:8px;border:1px solid #e2e8f0}
.img-buttons{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.guest-banner{background:#dcfce7;color:#166534;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:.92em}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;z-index:2000;font-size:1.1em;color:#0090db;font-weight:600}
</style>
</head>
<body>

<div id="loading">⏳ Загрузка данных...</div>

<div id="authScreen" class="auth-container hidden">
  <h1>🧪 Тесты Авито</h1>
  <div class="card">
    <div class="auth-tabs">
      <button class="auth-tab active" data-authtab="login" onclick="switchAuthTab('login')">Вход</button>
      <button class="auth-tab" data-authtab="register" onclick="switchAuthTab('register')">Регистрация</button>
      <button class="auth-tab" data-authtab="guest" onclick="switchAuthTab('guest')">Гость</button>
    </div>
    <div id="authMsg"></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-row"><label>Логин</label><input type="text" id="loginUser" required></div>
      <div class="form-row"><label>Пароль</label><input type="password" id="loginPass" required></div>
      <button type="submit">Войти</button>
    </form>
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-row"><label>Логин</label><input type="text" id="regUser" required minlength="3"></div>
      <div class="form-row"><label>Пароль</label><input type="password" id="regPass" required minlength="4"></div>
      <div class="form-row"><label>Ещё раз</label><input type="password" id="regPass2" required></div>
      <button type="submit">Создать</button>
    </form>
    <form id="guestForm" class="hidden" onsubmit="handleGuest(event)">
      <div class="form-row"><label>Ваше ФИО</label><input type="text" id="guestFio" required placeholder="Иванов Иван Иванович"></div>
      <p style="font-size:.85em;color:#64748b;margin:0 0 14px">Без регистрации. Результаты сохранятся с вашим ФИО.</p>
      <button type="submit">Продолжить как гость</button>
    </form>
    <p class="auth-hint" id="authHint"></p>
  </div>
</div>

<div id="app" class="hidden">
  <div class="userbar">
    <div>Вы вошли как <b id="currentUser"></b><span id="currentRoleBadge" class="role-badge"></span></div>
    <div style="display:flex;gap:8px">
      <button id="changePassBtn" class="small secondary hidden" onclick="openChangePassModal()">🔑 Сменить пароль</button>
      <button class="small secondary" onclick="logout()">Выйти</button>
    </div>
  </div>
  <h1>🧪 Тесты Авито</h1>
  <div id="guestBanner" class="guest-banner hidden"></div>
  <div class="tabs">
    <button class="tab active" data-tab="tests" onclick="switchTab('tests')">📚 Тесты</button>
    <button class="tab admin-only hidden" data-tab="results" onclick="switchTab('results')">📊 Результаты</button>
    <button class="tab admin-only hidden" data-tab="users" onclick="switchTab('users')">👥 Пользователи</button>
  </div>

  <div id="tab-tests">
    <div id="testsListView">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
          <h2 style="margin:0">Доступные тесты</h2>
          <button class="admin-only hidden small" onclick="createTest()">+ Создать тест</button>
        </div>
        <div id="testsList"></div>
      </div>
    </div>
    <div id="startView" class="card hidden">
      <h2 id="startTitle"></h2>
      <p style="color:#64748b;font-size:.92em" id="startInfo"></p>
      <div class="toolbar">
        <button onclick="startTest()">▶ Начать</button>
        <button class="secondary" onclick="backToTests()">← К списку</button>
      </div>
    </div>
    <div id="testView" class="card hidden">
      <div class="progress" id="progress"></div>
      <div class="question-text" id="questionText"></div>
      <div id="questionImageWrap"></div>
      <div id="options"></div>
      <div id="resultBox"></div>
      <div class="toolbar">
        <button id="checkBtn" onclick="checkAnswer()">Проверить</button>
        <button id="nextBtn" class="secondary hidden" onclick="nextQuestion()">Следующий →</button>
      </div>
    </div>
    <div id="finishView" class="card hidden">
      <h2>📊 Результаты</h2>
      <div class="stats" id="finalStats"></div>
      <div class="toolbar">
        <button onclick="startTest()">Пройти заново</button>
        <button class="secondary" onclick="backToTests()">← К списку</button>
      </div>
    </div>
  </div>

  <div id="tab-results" class="hidden">
    <div class="card">
      <h2>Результаты по тестам</h2>
      <div class="form-row" style="max-width:400px"><label>Тест:</label>
        <select id="resultsTestFilter" onchange="renderResults()"></select>
      </div>
      <div class="form-row" style="max-width:400px"><label>Пользователь / гость:</label>
        <select id="resultsUserFilter" onchange="renderResults()"><option value="">Все</option></select>
      </div>
      <h3>Сводка</h3>
      <div class="summary-grid" id="globalSummary"></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <h2 style="margin:0">История</h2>
        <button class="small danger" onclick="clearTestHistory()">🗑 Очистить историю теста</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <div id="tab-users" class="hidden">
    <div class="card"><h2>Пользователи</h2><div id="usersList"></div></div>
  </div>

  <div id="tab-editor" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <div>
          <h2 style="margin:0" id="editorTitle">Редактор теста</h2>
          <p style="color:#64748b;font-size:.88em;margin:4px 0 0" id="editorInfo"></p>
        </div>
        <button class="secondary small" onclick="backToTests()">← К тестам</button>
      </div>
      <div class="form-row"><label>Название теста</label>
        <input type="text" id="editorTestName" oninput="updateTestName(this.value)">
      </div>
      <div id="editorMsg"></div>
      <div id="editorList"></div>
      <div class="toolbar"><button onclick="addQuestion()">+ Добавить вопрос</button></div>
    </div>
  </div>
</div>

<div id="changePassModal" class="modal-backdrop hidden" onclick="if(event.target===this)closeChangePassModal()">
  <div class="modal">
    <h3>Сменить пароль администратора</h3>
    <div class="form-row"><label>Текущий пароль</label><input type="password" id="chOldPass"></div>
    <div class="form-row"><label>Новый пароль</label><input type="password" id="chNewPass" placeholder="Минимум 4 символа"></div>
    <div class="form-row"><label>Новый пароль ещё раз</label><input type="password" id="chNewPass2"></div>
    <div id="chPassMsg" style="font-size:.9em;color:#dc2626;margin-bottom:10px"></div>
    <div class="toolbar" style="justify-content:flex-end">
      <button class="secondary" onclick="closeChangePassModal()">Отмена</button>
      <button onclick="submitChangePass()">Сохранить</button>
    </div>
  </div>
</div>

<div id="imageModal" class="modal-backdrop hidden" onclick="if(event.target===this)closeImageModal()">
  <div class="modal">
    <h3>Прикрепить картинку</h3>
    <div class="form-row"><label>URL картинки</label><input type="text" id="imgUrlInput" placeholder="https://..."></div>
    <div class="form-row"><label>или файл с диска</label><input type="file" id="imgFileInput" accept="image/*" onchange="loadImageFile(event)"></div>
    <div id="imgPreviewWrap"></div>
    <div class="toolbar" style="justify-content:flex-end">
      <button class="secondary" onclick="clearImage">Убрать картинку</button>
      <button class="secondary" onclick="closeImageModal()">Отмена</button>
      <button onclick="saveImage()">Применить</button>
    </div>
  </div>
</div>

<script type="module">
/* ============================================================
   FIREBASE ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc,
  getDocs, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
  query, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPWPw6-SeO9_4Nwt1ZmwxcGRI5dnucir4",
  authDomain: "avito-tests.firebaseapp.com",
  projectId: "avito-tests",
  storageBucket: "avito-tests.firebasestorage.app",
  messagingSenderId: "1007097355508",
  appId: "1:1007097355508:web:a98bf4d3d4069fc21392a1",
  measurementId: "G-WPJ06LT324"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

/* ============================================================
   КЭШ ДАННЫХ В ПАМЯТИ
   (чтобы не переписывать весь код под async)
   ============================================================ */
var CACHE = {
  users: [],
  tests: [],
  history: []
};

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function hashPass(p){
  var h=5381;
  for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))|0;
  return 'h'+Math.abs(h).toString(36)+'_'+p.length
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  })
}
function showMsg(id,type,txt){
  var el=document.getElementById(id);
  if(!el)return;
  el.className='show '+type;
  el.textContent=txt;
  setTimeout(function(){el.className='';el.textContent=''},3500)
}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function hideLoading(){
  var l=document.getElementById('loading');
  if(l)l.classList.add('hidden')
}
function showLoading(txt){
  var l=document.getElementById('loading');
  if(l){l.classList.remove('hidden');l.textContent='⏳ '+(txt||'Загрузка...')}
}

/* ============================================================
   ЗАГРУЗКА ВСЕХ ДАННЫХ ИЗ FIRESTORE
   ============================================================ */
async function loadAllData(){
  showLoading('Загрузка пользователей...');
  try {
    var uSnap = await getDocs(collection(db, 'users'));
    CACHE.users = uSnap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
  } catch(e) { console.error('users:', e); CACHE.users = []; }

  showLoading('Загрузка тестов...');
  try {
    var tSnap = await getDocs(collection(db, 'tests'));
    CACHE.tests = tSnap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
  } catch(e) { console.error('tests:', e); CACHE.tests = []; }

  showLoading('Загрузка истории...');
  try {
    var hSnap = await getDocs(collection(db, 'history'));
    CACHE.history = hSnap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
  } catch(e) { console.error('history:', e); CACHE.history = []; }
}

/* ============================================================
   СОЗДАНИЕ АДМИНА И ДЕМО-ТЕСТОВ ПРИ ПЕРВОМ ЗАПУСКЕ
   ============================================================ */
async function ensureAdminAndDemos(){
  if(CACHE.users.length === 0){
    var adminId = genId();
    var admin = {
      login: 'admin',
      passHash: hashPass('admin'),
      role: 'admin',
      createdAt: new Date().toISOString()
    };
    await setDoc(doc(db, 'users', adminId), admin);
    CACHE.users.push(Object.assign({_id:adminId}, admin));
  }
  if(CACHE.tests.length === 0){
    var demo1 = {
      name: 'Демо: общие знания',
      questions: [
        {question:'Столица Франции?',options:['Лондон','Париж','Берлин','Мадрид'],correct:1,image:''},
        {question:'7 × 8 = ?',options:['54','56','48','64'],correct:1,image:''}
      ]
    };
    var demo2 = {
      name: 'Демо: Авито',
      questions: [
        {question:'Что такое Авито?',options:['Соцсеть','Доска объявлений','Мессенджер','Банк'],correct:1,image:''},
        {question:'Основной цвет Авито?',options:['Красный','Синий','Зелёный','Жёлтый'],correct:1,image:''}
      ]
    };
    var d1Id = genId(); var d2Id = genId();
    await setDoc(doc(db,'tests',d1Id), demo1);
    await setDoc(doc(db,'tests',d2Id), demo2);
    CACHE.tests.push(Object.assign({_id:d1Id}, demo1));
    CACHE.tests.push(Object.assign({_id:d2Id}, demo2));
  }
}

/* ============================================================
   ГЕТТЕРЫ (заменяют старые localStorage-функции)
   ============================================================ */
function getUsers(){ return CACHE.users.slice(); }
function getTests(){ return CACHE.tests.slice(); }
function getHistory(){ return CACHE.history.slice(); }

/* ============================================================
   СЕССИЯ (localStorage — только сессия текущего браузера)
   ============================================================ */
var SESSION_KEY = 't_session_v2';
function getSession(){
  try{return JSON.parse(localStorage.getItem(SESSION_KEY))}catch(e){return null}
}
function setSession(s){
  s?localStorage.setItem(SESSION_KEY,JSON.stringify(s)):localStorage.removeItem(SESSION_KEY)
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
async function initApp(){
  try {
    await loadAllData();
    await ensureAdminAndDemos();
  } catch(e) {
    hideLoading();
    document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#dc2626;font-family:system-ui">'+
      '<h2>Ошибка подключения к базе данных</h2>'+
      '<p>'+esc(e.message)+'</p>'+
      '<p style="color:#64748b;font-size:.9em;margin-top:20px">Проверьте, что в Firebase Firestore Database создана и правила разрешают чтение/запись.</p>'+
      '</div>';
    return;
  }
  hideLoading();

  var s = getSession();
  if(s){
    if(s.type==='guest'){
      enterApp({login:s.fio,role:'guest',fio:s.fio,isGuest:true});
      return
    }
    var u = CACHE.users.find(function(x){return x.login===s.login});
    if(u){enterApp(u);return}
    setSession(null)
  }
  showAuthScreen()
}

function showAuthScreen(){
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  var hint=document.getElementById('authHint');
  if(CACHE.users.length===1 && CACHE.users[0].login==='admin'){
    hint.innerHTML='👋 Войдите как <b>admin / admin</b> или пройдите тест как гость'
  } else {
    hint.textContent='Войдите, создайте аккаунт или пройдите тест как гость'
  }
}

function switchAuthTab(name){
  document.querySelectorAll('.auth-tab').forEach(function(t){t.classList.toggle('active',t.dataset.authtab===name)});
  document.getElementById('loginForm').classList.toggle('hidden',name!=='login');
  document.getElementById('registerForm').classList.toggle('hidden',name!=='register');
  document.getElementById('guestForm').classList.toggle('hidden',name!=='guest');
  var m=document.getElementById('authMsg');m.className='';m.textContent=''
}

async function handleLogin(e){
  e.preventDefault();
  var login=document.getElementById('loginUser').value.trim();
  var pass=document.getElementById('loginPass').value;
  var u=CACHE.users.find(function(x){return x.login.toLowerCase()===login.toLowerCase()});
  if(!u){showMsg('authMsg','err','Пользователь не найден');return}
  if(u.passHash!==hashPass(pass)){showMsg('authMsg','err','Неверный пароль');return}
  setSession({type:'user',login:u.login});
  document.getElementById('loginPass').value='';

async function handleRegister(e){

    await setDoc(doc(db,'users',id), nu);

  }
  CACHE.users.push(Object.assign({_id:id}, nu));
  setSession({type:'user',login:nu.login});
  document.getElementById('regUser').value='';
  document.getElementById('regPass').value='';
  document.getElementById('regPass2').value='';

function switchTab(name){
  var adminOnly=['results','users','editor'];
  if(adminOnly.indexOf(name)!==-1 && (!currentUser||currentUser.role!=='admin'))name='tests';
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===name)});
  ['tests','results','users','editor'].forEach(function(n){
    var el=document.getElementById('tab-'+n);
    if(el)el.classList.toggle('hidden',n!==name)
  });
  if(name==='tests')renderTests();
  if(name==='results')renderResults();
  if(name==='users')renderUsers();
  if(name==='editor')renderEditor()
}

   ПРОХОЖДЕНИЕ

var cur=0;var sel=null;var chk=false;var qStats=[];var started=0;

function startTest(){
  if(!currentTest)return;
  cur=0;
  qStats=currentTest.questions.map(function(){return{attempts:0,solved:false}});
  started=Date.now();
  document.getElementById('startView').classList.add('hidden');
  document.getElementById('finishView').classList.add('hidden');
  document.getElementById('testView').classList.remove('hidden');
  renderQ()
}

function renderQ(){
  chk=false;sel=null;
  var q=currentTest.questions[cur];
  document.getElementById('progress').textContent='Вопрос '+(cur+1)+' из '+currentTest.questions.length+' • Попыток: '+qStats[cur].attempts;
  document.getElementById('questionText').textContent=q.question||'(без текста)';

  var iw=document.getElementById('questionImageWrap');
  if(q.image&&q.image.trim()){
    iw.innerHTML='<img class="q-image" src="'+esc(q.image)+'" onerror="this.style.display=\'none\'">'
  } else {
    iw.innerHTML=''
  }

  var rb=document.getElementById('resultBox');rb.innerHTML='';rb.className='';
  var opts=document.getElementById('options');opts.innerHTML='';
  q.options.forEach(function(text,i){
    var l=document.createElement('label');
    l.className='option';l.dataset.i=i;
    l.innerHTML='<input type="radio" name="q" value="'+i+'"> '+esc(text||('Вариант '+(i+1)));
    l.onclick=function(){pickOption(i,l)};
    opts.appendChild(l)
  });
  var cb=document.getElementById('checkBtn');cb.classList.remove('hidden');cb.disabled=false;
  document.getElementById('nextBtn').classList.add('hidden')
}

function pickOption(i,l){
  if(chk)return;
  sel=i;
  document.querySelectorAll('.option').forEach(function(el){el.classList.remove('selected')});
  l.classList.add('selected')
}

function checkAnswer(){
  if(sel===null){
    var r=document.getElementById('resultBox');
    r.innerHTML='⚠️ Выберите вариант';r.className='result fail';return
  }
  chk=true;qStats[cur].attempts++;
  var correct=currentTest.questions[cur].correct;
  var ok=sel===correct;
  document.querySelectorAll('.option').forEach(function(el,i){
    if(i===correct)el.classList.add('correct');
    else if(i===sel)el.classList.add('wrong')
  });
  var rb=document.getElementById('resultBox');
  if(ok){
    qStats[cur].solved=true;
    rb.className='result ok';rb.textContent='✅ Верно! Попыток: '+qStats[cur].attempts;
    document.getElementById('checkBtn').classList.add('hidden');
    var nb=document.getElementById('nextBtn');nb.classList.remove('hidden');
    nb.textContent=(cur===currentTest.questions.length-1)?'Показать результаты →':'Следующий вопрос →'
  } else {
    rb.className='result fail';rb.textContent='❌ Неверно (попытка '+qStats[cur].attempts+'). Ещё раз.';
    setTimeout(function(){
      chk=false;
      document.querySelectorAll('.option').forEach(function(el){el.classList.remove('correct','wrong')});
      var s=document.querySelector('.option[data-i="'+sel+'"]');
      if(s)s.classList.add('selected');
      document.getElementById('checkBtn').disabled=false
    },900)
  }
  document.getElementById('progress').textContent='Вопрос '+(cur+1)+' из '+currentTest.questions.length+' • Попыток: '+qStats[cur].attempts
}

function nextQuestion(){
  if(cur<currentTest.questions.length-1){cur++;renderQ()}
  else finishTest()
}

async function finishTest(){
  document.getElementById('testView').classList.add('hidden');
  document.getElementById('finishView').classList.remove('hidden');
  var tot=qStats.reduce(function(s,q){return s+q.attempts},0);
  var ft=qStats.filter(function(q){return q.solved&&q.attempts===1}).length;
  var el=Math.round((Date.now()-started)/1000);
  document.getElementById('finalStats').innerHTML=
    '<div class="stat"><b>'+currentTest.questions.length+'</b>вопросов</div>'+
    '<div class="stat"><b>'+qStats.filter(function(q){return q.solved}).length+'</b>решено</div>'+
    '<div class="stat"><b>'+ft+'</b>с 1-й попытки</div>'+
    '<div class="stat"><b>'+tot+'</b>попыток</div>'+
    '<div class="stat"><b>'+el+'</b>сек</div>';

  var rec = {
    testId:currentTest._id,
    testName:currentTest.name,
    user:currentUser.login,
    userRole:currentUser.role,
    fio:currentUser.role==='guest'?currentUser.fio:null,
    date:new Date().toLocaleString('ru-RU'),
    timestamp:Date.now(),
    questions:currentTest.questions.length,
    totalAttempts:tot,
    solvedFirstTry:ft,
    elapsed:el
  };
  var id = genId();
  try {
    await setDoc(doc(db,'history',id), rec);
    CACHE.history.unshift(Object.assign({_id:id}, rec));
  } catch(e){
    console.error('Не удалось сохранить результат:', e);
    alert('Результат не сохранён в облако: '+e.message)
  }
}

function renderResults(){

  var h=getHistory();
  var sel1=document.getElementById('resultsTestFilter');
  var cur1=sel1.value;
  sel1.innerHTML='<option value="">— выберите тест —</option>'+
    tests.map(function(t){return '<option value="'+t._id+'"'+(t._id===cur1?' selected':'')+'>'+esc(t.name)+'</option>'}).join('');
  if(!cur1&&tests.length){cur1=tests[0]._id;sel1.value=cur1}

  var sel2=document.getElementById('resultsUserFilter');
  var cur2=sel2.value;
  var users=[];h.forEach(function(r){if(r.user&&users.indexOf(r.user)===-1)users.push(r.user)});
  sel2.innerHTML='<option value="">Все</option>'+
    users.map(function(u){return '<option value="'+esc(u)+'"'+(u===cur2?' selected':'')+'>'+esc(u)+'</option>'}).join('');

  var filtered=h.filter(function(r){
    if(cur1&&r.testId!==cur1)return false;
    if(cur2&&r.user!==cur2)return false;
    return true
  });

  var sum=document.getElementById('globalSummary');
  if(!filtered.length){
    sum.innerHTML='<div class="empty-state" style="grid-column:1/-1">Нет прохождений по этому фильтру</div>'
  } else {
    var totRuns=filtered.length;
    var totQ=filtered.reduce(function(s,r){return s+r.questions},0);
    var totA=filtered.reduce(function(s,r){return s+r.totalAttempts},0);
    var totF=filtered.reduce(function(s,r){return s+r.solvedFirstTry},0);
    sum.innerHTML=
      '<div class="summary-box"><div class="val">'+totRuns+'</div><div class="lbl">прохождений</div></div>'+
      '<div class="summary-box"><div class="val">'+totQ+'</div><div class="lbl">вопросов</div></div>'+
      '<div class="summary-box"><div class="val">'+totA+'</div><div class="lbl">попыток</div></div>'+
      '<div class="summary-box"><div class="val">'+totF+'</div><div class="lbl">с 1-й</div></div>'
  }

  var list=document.getElementById('historyList');
  if(!filtered.length){list.innerHTML='<div class="empty-state">Пусто</div>';return}
  list.innerHTML=filtered.map(function(r){
    var who=r.userRole==='guest'?'👤 '+esc(r.fio)+' (гость)':'👤 '+esc(r.user);
    return '<div class="history-item"><div class="history-head">'+
      '<div class="h-title">'+esc(r.date)+' — <span style="color:#0090db">'+esc(r.testName)+'</span></div>'+
      '<div class="h-meta">'+who+' • '+r.questions+' вопр. • '+r.totalAttempts+' попыток • '+r.solvedFirstTry+' с 1-й • '+r.elapsed+' сек</div>'+
    '</div></div>'
  }).join('')
}

async function clearTestHistory(){
  var sel1=document.getElementById('resultsTestFilter').value;
  if(!sel1){alert('Выберите тест');return}
  if(!confirm('Удалить историю по этому тесту?'))return;
  var toDelete=CACHE.history.filter(function(r){return r.testId===sel1});

    for(var i=0;i<toDelete.length;i++){

    CACHE.history=CACHE.history.filter(function(r){return r.testId!==sel1});

  }

/* --- Сохранение изменений в редакторе (автоматически в Firestore) --- */
async function saveTestField(updates){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  try{
    await updateDoc(doc(db,'tests',editTestId), updates);
  } catch(e){
    showMsg('editorMsg','err','Ошибка: '+e.message)
  }
}

function updateTestName(v){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.name=v;
  document.getElementById('editorTitle').textContent='Редактор: '+v;
  saveTestField({name:v})
}

function addQuestion(){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions.push({question:'',options:['','','',''],correct:0,image:''});
  saveTestField({questions:t.questions});
  renderEditor()
}

function updQ(qi,v){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions[qi].question=v;
  saveTestField({questions:t.questions})
}

function updOpt(qi,oi,v){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions[qi].options[oi]=v;
  saveTestField({questions:t.questions})
}

function setCorrect(qi,oi){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions[qi].correct=oi;
  saveTestField({questions:t.questions})
}

function addOpt(qi){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions[qi].options.push('');
  saveTestField({questions:t.questions});
  renderEditor()
}

function delOpt(qi,oi){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t||t.questions[qi].options.length<=2)return;
  t.questions[qi].options.splice(oi,1);
  if(t.questions[qi].correct===oi)t.questions[qi].correct=0;
  else if(t.questions[qi].correct>oi)t.questions[qi].correct--;
  saveTestField({questions:t.questions});
  renderEditor()
}

function delQ(qi){
  if(!confirm('Удалить вопрос?'))return;
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions.splice(qi,1);
  saveTestField({questions:t.questions});
  renderEditor()
}

/* ============================================================
   КАРТИНКИ
   ============================================================ */
var imgTargetQ=null;
var imgPendingData=null;

function openImageModal(qi){
  imgTargetQ=qi;
  imgPendingData=null;
  document.getElementById('imgUrlInput').value='';
  document.getElementById('imgFileInput').value='';
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  var cur=t?t.questions[qi].image:'';
  document.getElementById('imgPreviewWrap').innerHTML=cur?'<img class="img-preview" src="'+esc(cur)+'">':'';
  document.getElementById('imageModal').classList.remove('hidden')
}
function closeImageModal(){
  document.getElementById('imageModal').classList.add('hidden');
  imgTargetQ=null;imgPendingData=null
}
function loadImageFile(e){
  var f=e.target.files[0];if(!f)return;
  if(f.size>800*1024){
    alert('Файл слишком большой. Firestore ограничивает размер документа 1 МБ. Используйте URL или файл до 800 КБ.');
    e.target.value='';return
  }
  var r=new FileReader();
  r.onload=function(ev){
    imgPendingData=ev.target.result;
    document.getElementById('imgPreviewWrap').innerHTML='<img class="img-preview" src="'+imgPendingData+'">'
  };
  r.readAsDataURL(f)
}
function saveImage(){
  if(imgTargetQ===null)return;
  var url=document.getElementById('imgUrlInput').value.trim();
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  if(imgPendingData){t.questions[imgTargetQ].image=imgPendingData}
  else if(url){t.questions[imgTargetQ].image=url}
  saveTestField({questions:t.questions});
  closeImageModal();
  renderEditor()
}
function clearImage(){
  document.getElementById('imgUrlInput').value='';
  document.getElementById('imgFileInput').value='';
  imgPendingData=null;
  document.getElementById('imgPreviewWrap').innerHTML=''
}
function removeQImage(qi){
  var t=CACHE.tests.find(function(x){return x._id===editTestId});
  if(!t)return;
  t.questions[qi].image='';
  saveTestField({questions:t.questions});
  renderEditor()
}

/* ============================================================
   СТАРТ
   ============================================================ */
initApp();
</script>
